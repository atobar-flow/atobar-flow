[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atobar-ops"
version = "0.2.0"
description = "Unified operations CLI for atobar-flow"
requires-python = ">=3.11"
dependencies = [
    "atobar-contracts",
    "supabase>=2.4.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
atobar-ops = "atobar_ops.cli:main"

[tool.uv.sources]
atobar-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/atobar_ops"]
