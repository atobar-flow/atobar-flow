[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "control-panel"
version = "0.2.0"
description = "atobar-flow public gateway, OAuth/OIDC, KMS BYOK LLM key vault, and Web UI"
requires-python = ">=3.11"
dependencies = [
    "atobar-contracts",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "supabase>=2.4.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[tool.uv.sources]
atobar-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/control_panel"]
