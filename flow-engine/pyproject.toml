[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flow-engine"
version = "0.2.0"
description = "Deterministic Conductor orchestration, EC2 Spot dispatch, GC reaper, and tenancy"
requires-python = ">=3.11"
dependencies = [
    "atobar-contracts",
    "boto3>=1.34.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyjwt[crypto]>=2.8.0",
    "supabase>=2.4.0",
    "uvicorn[standard]>=0.29.0",
]

[tool.uv.sources]
atobar-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/flow_engine"]
