[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flow-agent"
version = "0.2.0"
description = "Warm Spot Session Supervisor, nanobot runtime, role runners, MCP server, and vision stack"
requires-python = ">=3.11"
dependencies = [
    "atobar-contracts",
    "google-genai>=1.0.0",
    "nanobot-ai==0.3.5",
    "mcp>=1.9,<2",
    "websockets>=12.0",
    "Pillow>=10.0.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[tool.uv.sources]
atobar-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/flow_agent"]
