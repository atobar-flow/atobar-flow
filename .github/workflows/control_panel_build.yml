name: Control Panel Build and GHCR Publish

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'control-panel/**'
      - 'flow-engine/**'
      - 'scripts/onboard.sh'
      - 'infra/control-panel/**'
      - '.github/workflows/control_panel_build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'control-panel/**'
      - 'flow-engine/**'
      - 'scripts/onboard.sh'
      - 'infra/control-panel/**'
      - '.github/workflows/control_panel_build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build container images
        run: |
          docker build \
            -t "ghcr.io/${{ github.repository_owner }}/control-panel:sha-${{ github.sha }}" \
            -t "ghcr.io/${{ github.repository_owner }}/control-panel:latest" \
            -f control-panel/Dockerfile .
          docker build \
            -t "ghcr.io/${{ github.repository_owner }}/flow-engine:sha-${{ github.sha }}" \
            -t "ghcr.io/${{ github.repository_owner }}/flow-engine:latest" \
            -f flow-engine/Dockerfile .

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push container images to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push "ghcr.io/${{ github.repository_owner }}/control-panel:sha-${{ github.sha }}"
          docker push "ghcr.io/${{ github.repository_owner }}/control-panel:latest"
          docker push "ghcr.io/${{ github.repository_owner }}/flow-engine:sha-${{ github.sha }}"
          docker push "ghcr.io/${{ github.repository_owner }}/flow-engine:latest"
