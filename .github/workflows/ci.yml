name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.24.3"
      ACTIONLINT_VERSION: "1.7.7"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.11"
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync --locked --all-packages
      - name: Install actionlint
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tgz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C "$HOME/.local/bin" actionlint
          rm -f /tmp/actionlint.tgz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install gitleaks
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C "$HOME/.local/bin" gitleaks
          rm -f /tmp/gitleaks.tgz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint (ruff)
        run: uv run --no-sync ruff check .
      - name: Type check (mypy)
        run: uv run --no-sync mypy contracts/src control-panel/src flow-engine/src flow-agent/src atobar-ops/src --ignore-missing-imports
      - name: Test (pytest)
        run: uv run --no-sync pytest -q --durations=10
      - name: Validate schemas and tenant manifests
        run: |
          uv run --no-sync python -m atobar_contracts.schema --check
          uv run --no-sync python -m atobar_contracts.manifest
      - name: Secret scan (gitleaks)
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            if [ -n "$BASE" ] && [ -n "$HEAD" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null && git cat-file -e "${HEAD}^{commit}" 2>/dev/null; then
              RANGE="${BASE}..${HEAD}"
            else
              echo "PR base/head SHA unreachable in clone; scanning full history"
              RANGE="HEAD"
            fi
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              echo "Push before SHA ($BEFORE) is zero or unreachable; scanning full history"
              RANGE="HEAD"
            else
              RANGE="${BEFORE}..${AFTER}"
            fi
          fi
          gitleaks git --no-banner --redact --config .gitleaks.toml -v --log-opts="$RANGE"
