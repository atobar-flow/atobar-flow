[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atobar-contracts"
version = "0.2.0"
description = "Shared deterministic schemas, envelopes, and state machine contracts for atobar-flow"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atobar_contracts"]
